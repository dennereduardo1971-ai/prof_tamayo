name: Publicar PWA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar pasta do site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js styles src assets _site/
          # Evita que o Jekyll do Pages ignore pastas iniciadas por _
          touch _site/.nojekyll
          ls -R _site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
